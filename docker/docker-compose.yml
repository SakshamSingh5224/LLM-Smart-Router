# Phase 4 local stack: router_service (:8001) + gateway (:8000, serves the frontend)
# + Prometheus (:9090) + Grafana (:3000).
#
# Prereqs: `make train-router` once, so results/router_artifact.joblib exists
# (both images COPY it in at build time).
#
# Run:      docker compose -f docker/docker-compose.yml --env-file ../.env up --build
# Chaos:    docker compose -f docker/docker-compose.yml kill router_service
# Stop:     docker compose -f docker/docker-compose.yml down

services:
  redis:
    image: redis:7-alpine
    container_name: llm-router-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis_storage:/data
    command: ["redis-server", "--appendonly", "yes"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-router-qdrant
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-lc", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10

  router_service:
    build:
      context: ..
      dockerfile: docker/router_service.Dockerfile
    ports: ["8001:8001"]
    environment:
      GATEWAY_CORS_ORIGINS: "*"
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    ports: ["8000:8000"]
    volumes:
      # Persist Hugging Face/FastEmbed downloads across gateway rebuilds; avoids
      # repeating the multi-minute cold model download after container recreation.
      - model_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Talk to the router_service container over the compose network -
      # demonstrates the plan's "router scales independently of the gateway".
      ROUTER_SERVICE_URL: "http://router_service:8001"
      OLLAMA_HOST: "http://host.docker.internal:11434"
      LOW_PROVIDER: "ollama"
      LOW_BASE_URL: "${LOW_BASE_URL:-https://api.groq.com/openai/v1}"
      LOW_MODEL: "qwen2.5:1.5b"
      LOW_API_KEY: "${LOW_API_KEY:-${HIGH_API_KEY}}"
      HIGH_BASE_URL: "${HIGH_BASE_URL:-https://api.groq.com/openai/v1}"
      HIGH_MODEL: "${HIGH_MODEL:-openai/gpt-oss-120b}"
      HIGH_API_KEY: "${HIGH_API_KEY:?set HIGH_API_KEY in .env}"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:-}"
      JWT_SECRET: "${JWT_SECRET:-5224}"
      GATEWAY_CORS_ORIGINS: "${GATEWAY_CORS_ORIGINS:-*}"
      GATEWAY_CACHE_ENABLED: "${GATEWAY_CACHE_ENABLED:-true}"
      GATEWAY_CACHE_SIZE: "${GATEWAY_CACHE_SIZE:-500}"
      GATEWAY_CACHE_TTL_S: "${GATEWAY_CACHE_TTL_S:-3600}"
      GATEWAY_MAX_TOKENS: "${GATEWAY_MAX_TOKENS:-512}"
      COST_PER_1K_LOW: "${COST_PER_1K_LOW:-0.0}"
      COST_PER_1K_HIGH: "${COST_PER_1K_HIGH:-0.0}"
      ENABLE_MVP3_ROUTING: "${ENABLE_MVP3_ROUTING:-true}"
      INTENT_THRESHOLD: "${INTENT_THRESHOLD:-0.70}"
      ENABLE_MVP3_RETRIEVAL: "${ENABLE_MVP3_RETRIEVAL:-true}"
      ENABLE_MVP3D_RAG: "${ENABLE_MVP3D_RAG:-true}"
      LOCAL_RAG_MODEL: "${LOCAL_RAG_MODEL:-qwen2.5:1.5b}"
      LOCAL_RAG_TEMPERATURE: "${LOCAL_RAG_TEMPERATURE:-0.2}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
      RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-10}"
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-base}"
      RERANKER_CANDIDATE_K: "${RERANKER_CANDIDATE_K:-10}"
      RERANK_TOP_K: "${RERANK_TOP_K:-3}"
      RERANKER_MAX_LENGTH: "${RERANKER_MAX_LENGTH:-512}"
      RERANK_RELEVANCE_THRESHOLD: "${RERANK_RELEVANCE_THRESHOLD:-0.70}"
      REDIS_URL: "redis://redis:6379/0"
      SEMANTIC_CACHE_ENABLED: "${SEMANTIC_CACHE_ENABLED:-true}"
      SEMANTIC_CACHE_THRESHOLD: "${SEMANTIC_CACHE_THRESHOLD:-0.82}"
      # Added for Phase 4 load/chaos testing: without these, this container
      # silently falls back to SQLite (chokes under concurrent load-test writes)
      # and the default 30 req/min rate limit (dominates results at load-test
      # volume). Both still default sanely for normal local dev use.
      DATABASE_URL: "${DATABASE_URL:-sqlite:///./sql_app.db}"
      GATEWAY_RATE_LIMIT_PER_MIN: "${GATEWAY_RATE_LIMIT_PER_MIN:-30}"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-bharat_knowledge_base}"
    depends_on:
      router_service:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway, router_service]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      QDRANT_URL: "http://qdrant:6333"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  qdrant_storage:
  redis_storage:
  model_cache:
