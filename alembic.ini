[alembic]
script_location = migrations

# sqlalchemy.url is intentionally left unset here - migrations/env.py pulls it
# from gateway.db.database.SQLALCHEMY_DATABASE_URL at runtime, so there is a
# single source of truth for the database URL (DATABASE_URL env var, falling
# back to the same local sqlite file the app itself uses) instead of this file
# and the app ever being able to drift out of sync with each other.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
