<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LLM Smart Router</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h2>LLM Smart Router</h2>
            <form id="authForm" onsubmit="event.preventDefault();">
                <input type="email" id="email" placeholder="Email Address" required />
                <input type="password" id="password" placeholder="Password" required />
                <button type="button" onclick="handleAuth('/api/auth/login')">Login</button>
                <button type="button" class="secondary" onclick="handleAuth('/api/auth/register')">Register</button>
            </form>
            <p id="message" style="color: var(--error); font-size: 0.9em; margin-top: 1rem;"></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Share the same configurable gateway URL as chat.html.
        const BACKEND_URL = (typeof window.API_BASE === "string" ? window.API_BASE : "").replace(/\/+$/, "");

        async function handleAuth(endpoint) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msgLabel = document.getElementById('message');
            
            if (!email || !password) {
                msgLabel.style.color = "var(--error)";
                msgLabel.innerText = "Please fill in all fields.";
                return;
            }

            msgLabel.style.color = "var(--muted)";
            msgLabel.innerText = "Processing...";
            
            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                let data;
                try {
                    data = await res.json();
                } catch (e) {
                    data = { detail: "Invalid server response format." };
                }
                
                if (res.ok) {
                    if (endpoint.includes('login')) {
                        localStorage.setItem('token', data.access_token);
                        window.location.href = '/chat.html'; 
                    } else {
                        msgLabel.style.color = "var(--low-text)";
                        msgLabel.innerText = "Registered successfully! You can now log in.";
                    }
                } else {
                    msgLabel.style.color = "var(--error)";
                    msgLabel.innerText = data.detail || 'Authentication failed.';
                }
            } catch (err) {
                console.error("Network error details:", err);
                msgLabel.style.color = "var(--error)";
                msgLabel.innerText = 'Network error. Check connection or CORS.';
            }
        }
    </script>
</body>
</html>
