<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LLM Smart Router</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 4px; cursor: pointer; background: #007bff; color: white; font-weight: bold; }
        button.secondary { background: #6c757d; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>LLM Smart Router</h2>
        <form id="authForm" onsubmit="event.preventDefault();">
            <input type="email" id="email" placeholder="Email Address" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="button" onclick="handleAuth('/api/auth/login')">Login</button>
            <button type="button" class="secondary" onclick="handleAuth('/api/auth/register')">Register</button>
        </form>
        <p id="message" style="color: red; font-size: 0.9em;"></p>
    </div>

    <script>
        // Your live Render backend URL
        const BACKEND_URL = "https://llm-gateway-62xo.onrender.com";

        async function handleAuth(endpoint) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const msgLabel = document.getElementById('message');
            
            if (!email || !password) {
                msgLabel.style.color = "red";
                msgLabel.innerText = "Please fill in all fields.";
                return;
            }

            msgLabel.style.color = "black";
            msgLabel.innerText = "Processing...";
            
            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                let data;
                try {
                    data = await res.json();
                } catch (e) {
                    data = { detail: "Invalid server response format." };
                }
                
                if (res.ok) {
                    if (endpoint.includes('login')) {
                        localStorage.setItem('token', data.access_token);
                        // FIXED: Redirects to chat.html instead of looping back to index.html
                        window.location.href = '/chat.html'; 
                    } else {
                        msgLabel.style.color = "green";
                        msgLabel.innerText = "Registered successfully! You can now log in.";
                    }
                } else {
                    msgLabel.style.color = "red";
                    msgLabel.innerText = data.detail || 'Authentication failed.';
                }
            } catch (err) {
                console.error("Network error details:", err);
                msgLabel.style.color = "red";
                msgLabel.innerText = 'Network error. Check connection or CORS.';
            }
        }
    </script>
</body>
</html>
