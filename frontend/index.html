<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Smart Router</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>LLM Smart Router</h1>
      <div class="controls">
        <label>Mode
          <select id="mode">
            <option value="aggressive">aggressive (cheapest)</option>
            <option value="balanced" selected>balanced</option>
            <option value="conservative">conservative (safest)</option>
          </select>
        </label>
        <label class="checkbox"><input type="checkbox" id="explain" /> explain routing</label>
        <span id="health" class="health" title="gateway / router status">●</span>
      </div>
    </header>

    <main id="thread" aria-live="polite"></main>

    <form id="composer">
      <textarea id="query" rows="2" placeholder="Ask anything… (Shift+Enter for a new line)"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <p class="hint">Simple prompts are answered by the local free model; complex ones are escalated to the strong
      free-tier model. This demo runs entirely on free infrastructure — no billing is involved.</p>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
