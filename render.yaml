# Free Render deployment: gateway only.
# Phase 3C's full bge-reranker-base stays local because Render Free is memory-constrained.
services:
  - type: web
    name: llm-gateway
    runtime: docker
    dockerfilePath: ./docker/gateway.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ROUTER_SERVICE_URL
        value: ""
      - key: ENABLE_MVP3_RETRIEVAL
        value: "false"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: bharat_knowledge_base
      - key: LOW_PROVIDER
        value: openai_compat
      - key: LOW_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LOW_MODEL
        value: openai/gpt-oss-20b
      - key: LOW_API_KEY
        sync: false
      - key: HIGH_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: HIGH_MODEL
        value: openai/gpt-oss-120b
      - key: HIGH_API_KEY
        sync: false
      - key: GATEWAY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GATEWAY_CORS_ORIGINS
        value: "*"
      - key: GATEWAY_CACHE_ENABLED
        value: "true"
      - key: ROUTER_MODE
        value: balanced
