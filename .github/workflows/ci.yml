name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install offline test dependencies (no Torch/model downloads)
        run: >-
          pip install pytest httpx python-dotenv pandas scikit-learn joblib
          fastapi sqlalchemy bcrypt 'python-jose[cryptography]'
          'qdrant-client>=1.12,<2' 'redis>=5,<7'
          prometheus-fastapi-instrumentator
      - name: Offline unit tests (no network/Ollama/Groq needed)
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          SEMANTIC_CACHE_ENABLED: 'false'
          ENABLE_MVP3_ROUTING: 'true'
          ENABLE_MVP3_RETRIEVAL: 'true'
          GATEWAY_RATE_LIMIT_PER_MIN: '10000'
          GATEWAY_API_KEY: ''
          HIGH_API_KEY: 'offline-test-key'
          ROUTER_SERVICE_URL: ''
          ROUTER_MODE: 'balanced'
          ROUTER_ARTIFACT_PATH: '/tmp/no-such-router.joblib'
        run: python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Both Dockerfiles COPY results/router_artifact.joblib, so CI needs a
      # placeholder artifact to validate the build without training on the real
      # (large) dataset every push.
      - name: Ensure a router artifact exists (build validation only)
        run: |
          if [ ! -f results/router_artifact.joblib ]; then
            pip install -r requirements.txt --quiet
            python scripts/make_dummy_artifact_for_ci.py
          fi
      - name: Build router_service image
        run: docker build -f docker/router_service.Dockerfile -t llm-router-service:ci .
      - name: Build gateway image
        run: docker build -f docker/gateway.Dockerfile -t llm-gateway:ci .

  # Fires only when router-related code/data changes -> matches the plan's
  # "CI/CD for router model updates independent of gateway/frontend deploys".
  router-retrain-check:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[retrain]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/prepare_dataset.py
      - run: python scripts/train_router.py
      - run: python scripts/eval_router_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: router-artifact
          path: results/router_artifact.joblib

